name: Publish direct-download desktop companions

on:
  push:
    branches: [main]
    paths:
      - 'windows-helper/**'
      - 'mac-helper/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build single-file Windows app
        shell: pwsh
        run: |
          dotnet publish windows-helper/MudraSmartCursorBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o windows-helper/dist
          New-Item -ItemType Directory -Force -Path publish
          Copy-Item windows-helper/dist/MudraSmartCursorBridge.exe publish/MudraSmartCursorBridge-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: mudra-package-windows
          path: publish/MudraSmartCursorBridge-Windows-x64.exe
          retention-days: 30

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package Mac app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "publish/MudraSmartCursorBridge.app/Contents/MacOS"
          cp mac-helper/Info.plist "publish/MudraSmartCursorBridge.app/Contents/Info.plist"
          swiftc -O mac-helper/Sources/MudraSmartCursorBridge/main.swift -framework CoreBluetooth -framework Network -framework AppKit -o publish/MudraSmartCursorBridge.app/Contents/MacOS/MudraSmartCursorBridge
          codesign --force --sign - "publish/MudraSmartCursorBridge.app"
          publish/MudraSmartCursorBridge.app/Contents/MacOS/MudraSmartCursorBridge --self-test
          ditto -c -k --sequesterRsrc --keepParent publish/MudraSmartCursorBridge.app "MudraSmartCursorBridge-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mudra-package-macos-${{ matrix.arch }}
          path: MudraSmartCursorBridge-macOS-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mudra-package-*
          path: release
          merge-multiple: true
      - name: Publish stable direct-download links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release/
          if ! gh release view preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create preview --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mudra Smart Cursor — Desktop Preview" --notes "Unsigned experimental Mudra status companions for already OS-paired HID devices. One launch opens the browser. Chrome may request loopback access; Windows SmartScreen and macOS Gatekeeper may warn about unsigned builds."
          fi
          gh release upload preview release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
